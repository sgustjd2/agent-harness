name: validate

# Structural validation: plugin manifests, marketplace catalogs, Skill metadata and
# boundary, plugin-root containment, path portability, version sync.
#
# Authoritative tooling: jsonschema for schemas, PyYAML for YAML. Installed from
# requirements-dev.txt into the runner's environment. The plugin runtime itself has
# no third-party dependency; these are development dependencies only.
#
# No model API key is configured and no model is invoked.
# No release is created, no artifact is published, no tag or commit is pushed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Confirm the plugin runtime declares no dependency
        run: |
          python - <<'PY'
          import pathlib, sys
          plugin = pathlib.Path("plugins/agent-harness")
          offenders = [p.as_posix() for p in plugin.rglob("*")
                       if p.name in {"requirements.txt", "pyproject.toml", "setup.py",
                                     "package.json", "Pipfile", "poetry.lock"}]
          if offenders:
              print("plugin root declares dependencies:", offenders, file=sys.stderr)
              sys.exit(1)
          print("plugin runtime declares no third-party dependency")
          PY

      - name: preflight (non-authoritative)
        run: python scripts/preflight.py

      - name: marketplace generation is deterministic and catalogs match source
        run: python scripts/generate_marketplaces.py --check

      - name: validate plugin manifests against packaging schemas
        run: python scripts/validate_manifests.py

      - name: validate marketplace catalogs against packaging schemas
        run: python scripts/validate_marketplaces.py

      - name: validate Skill metadata and installable-root boundary
        run: python scripts/validate_skills.py

      - name: check plugin-root containment
        run: python scripts/check_path_containment.py

      - name: check canonical path portability
        run: python scripts/check_path_portability.py

      - name: check version sync across all version-bearing files
        run: python scripts/check_version_sync.py

      - name: check for undocumented host commands
        run: python scripts/check_no_install_command.py

      - name: check no network access in runtime code
        run: python scripts/check_no_network.py

      - name: check adapter drift
        run: python scripts/check_adapter_drift.py

      - name: check dual-manifest co-location (static half only)
        run: python scripts/check_colocation.py
