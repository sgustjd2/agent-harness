name: test

# pytest is the authoritative test runner. Every deterministic test runs through it.
#
# Manual host tests (ATS-018-2, ATS-020, ATS-022 host surfaces) are deliberately NOT
# here: they need a real host and, in some cases, an interactive or paid model. Their
# recorded results live in docs/m1-experiments.md.
#
# No model API key is configured and no model is invoked.
# No release is created, no artifact is published, no tag or commit is pushed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux are supported platforms. Windows users are supported through
        # WSL, which the Linux runner represents. Native Windows is Deferred.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: pytest (deterministic tests only)
        run: python -m pytest -q -m "not manual and not host_cli"

      - name: Confirm manual and host_cli tests were not counted as passing
        run: |
          python -m pytest -q -m "manual or host_cli" --collect-only 2>&1 | tail -3
          echo "Manual and host-CLI tests are excluded from this run by design."

  offline:
    # Validation must work with no network available. Dependencies are installed first;
    # the checks themselves then run with sockets blocked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies (network used here, and only here)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run every deterministic check with sockets blocked
        run: |
          cat > sitecustomize.py <<'PY'
          import socket
          def _blocked(*a, **k):
              raise OSError("network access is blocked in this job")
          socket.socket = _blocked
          socket.create_connection = _blocked
          PY
          PYTHONPATH=. python scripts/validate_all.py
          rm -f sitecustomize.py
